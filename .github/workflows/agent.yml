name: agent

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'scripts/build-agent.*'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'shared/**'
      - 'scripts/build-agent.*'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/agent.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Agent version (MAJOR.MINOR.BUILD)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Build, test and publish
        run: scripts/build-agent.sh --rid all

  installer:
    name: MSI (Windows)
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Determine version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $version = $env:INPUT_VERSION
          if (-not $version) { $version = "1.0.$($env:RUN_NUMBER % 65535)" }
          if ($version -notmatch '^\d{1,3}\.\d{1,3}\.\d{1,5}$') { throw "Invalid version '$version'" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build agent and MSI (x64, arm64)
        shell: pwsh
        env:
          # Optional: provide a code-signing certificate through repository secrets.
          EASYPATCH_SIGN_PFX_BASE64: ${{ secrets.EASYPATCH_SIGN_PFX_BASE64 }}
          EASYPATCH_SIGN_PFX_PASSWORD: ${{ secrets.EASYPATCH_SIGN_PFX_PASSWORD }}
          EASYPATCH_SIGN_TIMESTAMP_URL: ${{ vars.EASYPATCH_SIGN_TIMESTAMP_URL }}
        run: |
          if ($env:EASYPATCH_SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'easypatch-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:EASYPATCH_SIGN_PFX_BASE64))
            $env:EASYPATCH_SIGN_PFX_PATH = $pfx
          }
          try {
            ./scripts/build-agent.ps1 -Version '${{ steps.version.outputs.value }}' -Architecture x64,arm64 -SkipTests
          }
          finally {
            if ($env:EASYPATCH_SIGN_PFX_PATH) { Remove-Item $env:EASYPATCH_SIGN_PFX_PATH -Force -ErrorAction SilentlyContinue }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easypatch-agent-${{ steps.version.outputs.value }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.sha256
          if-no-files-found: error
          retention-days: 30
